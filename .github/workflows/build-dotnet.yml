name: Build .NET Solution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3.4.2
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/ai-chat-aspire-meai.sln

      - name: Build solution
        run: dotnet build src/ai-chat-aspire-meai.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/ai-chat-aspire-meai.sln --no-build --verbosity normal
